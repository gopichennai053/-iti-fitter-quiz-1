<!DOCTYPE html>
<html lang="ta">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<title>ITI Fitter Quiz App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1f4037 0%, #99f2c8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 480px;
    padding: 28px;
    text-align: center;
  }
  h1 {
    color: #1f4037;
    margin-bottom: 6px;
    font-size: 24px;
  }
  .subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .chapter-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 65vh;
    overflow-y: auto;
  }
  .chapter-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border: 2px solid #e2e2e2;
    border-radius: 12px;
    background: #f7fbf9;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  .chapter-btn:hover {
    border-color: #1f8a5f;
    background: #eafaf1;
  }
  .chapter-name {
    font-weight: 600;
    color: #222;
    font-size: 15px;
  }
  .chapter-count {
    font-size: 12px;
    color: #888;
  }
  .chapter-score {
    font-size: 12px;
    color: #1f8a5f;
    font-weight: 700;
  }
  .back-btn {
    display: inline-block;
    margin-bottom: 15px;
    color: #1f8a5f;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    float: left;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    margin: 15px 0 20px;
    font-weight: 600;
    color: #555;
    font-size: 13px;
    clear: both;
  }
  .timer { color: #e63946; }
  .progress-bar {
    height: 8px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1f4037, #99f2c8);
    transition: width 0.3s ease;
  }
  .question {
    font-size: 17px;
    font-weight: 600;
    color: #222;
    margin-bottom: 22px;
    min-height: 55px;
    text-align: left;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option {
    padding: 13px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f9f9fb;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    transition: all 0.2s ease;
  }
  .option:hover { border-color: #1f8a5f; background: #eafaf1; }
  .option.correct { background: #d4f8d4; border-color: #2ecc71; }
  .option.wrong { background: #ffd6d6; border-color: #e63946; }
  .option.disabled { pointer-events: none; }
  .feedback {
    margin-top: 14px;
    font-weight: 600;
    min-height: 20px;
    font-size: 13px;
  }
  .btn {
    margin-top: 18px;
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #1f4037, #1f8a5f);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary {
    background: #eee;
    color: #333;
    margin-left: 8px;
  }
  .btn:hover { opacity: 0.9; }
  .result-emoji { font-size: 55px; margin-bottom: 8px; }
  .result-score { font-size: 26px; font-weight: 700; color: #1f4037; margin-bottom: 5px; }
  .result-msg { color: #666; margin-bottom: 6px; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="card">

  <div id="homeScreen">
    <h1>🔧 ITI ஃபிட்டர் வினாடி வினா</h1>
    <div class="subtitle">அத்தியாயம் தேர்ந்தெடுத்து பயிற்சி செய்யுங்கள்</div>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <div id="quizScreen" class="hidden">
    <span class="back-btn" onclick="goHome()">⬅ பின்செல்</span>
    <div class="topbar">
      <span id="qCounter">கேள்வி 1/6</span>
      <span class="timer" id="timer">⏱ 20</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="btn" onclick="restartChapter()">மீண்டும் முயற்சி</button>
    <button class="btn secondary" onclick="goHome()">அத்தியாயங்கள்</button>
  </div>

</div>

let currentChapter = 0;
let current = 0;
let score = 0;
let timer;
let timeLeft = 20;
let answered = false;
const chapterScores = {};

function renderHome() {
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');

  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  chapters.forEach((ch, idx) => {
    const div = document.createElement('div');
    div.className = 'chapter-btn';
    const best = chapterScores[idx];
    div.innerHTML = `
      <div>
        <div class="chapter-name">${ch.name}</div>
        <div class="chapter-count">${ch.questions.length} கேள்விகள்</div>
      </div>
      <div class="chapter-score">${best !== undefined ? '✔ ' + best + '/' + ch.questions.length : '▶'}</div>
    `;
    div.onclick = () => startChapter(idx);
    list.appendChild(div);
  });
}

function startChapter(idx) {
  currentChapter = idx;
  current = 0;
  score = 0;
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  timeLeft = 20;
  const chapter = chapters[currentChapter];
  const q = chapter.questions[current];
  document.getElementById('qCounter').textContent = `கேள்வி ${current + 1}/${chapter.questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / chapter.questions.length) * 100}%`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedback').textContent = '';
  document.getElementById('timer').textContent = `⏱ ${timeLeft}`;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectAnswer(idx);
    container.appendChild(div);
  });

  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = `⏱ ${timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      selectAnswer(-1);
    }
  }, 1000);
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const chapter = chapters[currentChapter];
  const q = chapter.questions[current];
  const options = document.querySelectorAll('.option');
  options.forEach(o => o.classList.add('disabled'));

  if (idx === q.answer) {
    options[idx].classList.add('correct');
    score++;
    document.getElementById('feedback').textContent = '✅ சரியான பதில்!';
    document.getElementById('feedback').style.color = '#2ecc71';
  } else {
    if (idx >= 0) options[idx].classList.add('wrong');
    options[q.answer].classList.add('correct');
    document.getElementById('feedback').textContent = idx === -1 ? "⏰ நேரம் முடிந்தது!" : '❌ தவறான பதில்!';
    document.getElementById('feedback').style.color = '#e63946';
  }

  setTimeout(() => {
    current++;
    if (current < chapter.questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 1200);
}

function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '100%';

  const chapter = chapters[currentChapter];
  chapterScores[currentChapter] = score;

  const pct = score / chapter.questions.length;
  let emoji = '🎉', msg = 'அருமையான முயற்சி!';
  if (pct < 0.4) { emoji = '😅'; msg = 'இன்னும் பயிற்சி செய்யுங்கள்!'; }
  else if (pct < 0.7) { emoji = '👍'; msg = 'நல்ல முயற்சி!'; }
  else if (pct < 1) { emoji = '🔥'; msg = 'சூப்பர், கிட்டத்தட்ட முழுமை!'; }
  else { emoji = '🏆'; msg = 'முழு மதிப்பெண்! அருமை!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = `${score} / ${chapter.questions.length}`;
  document.getElementById('resultMsg').textContent = msg;
}

function restartChapter() {
  startChapter(currentChapter);
}

function goHome() {
  clearInterval(timer);
  renderHome();
}

renderHome();
